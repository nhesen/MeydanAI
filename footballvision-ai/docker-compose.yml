services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      FOOTBALLVISION_REDIS: redis://redis:6379/0
      FOOTBALLVISION_SQLITE: /data/footballvision.sqlite
      FOOTBALLVISION_STORAGE: /data/jobs
      FOOTBALLVISION_DEVICE: ${FOOTBALLVISION_DEVICE:-cpu}
    volumes:
      - fv-data:/data
      - ./configs:/app/configs
      - ./models:/app/models
    ports:
      - "8088:8088"
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8088

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      FOOTBALLVISION_REDIS: redis://redis:6379/0
      FOOTBALLVISION_SQLITE: /data/footballvision.sqlite
      FOOTBALLVISION_STORAGE: /data/jobs
      FOOTBALLVISION_DEVICE: ${FOOTBALLVISION_DEVICE:-cpu}
    volumes:
      - fv-data:/data
      - ./configs:/app/configs
      - ./models:/app/models
    depends_on:
      - redis
    command: celery -A app.storage.tasks.celery_app worker --loglevel=info

volumes:
  fv-data:
